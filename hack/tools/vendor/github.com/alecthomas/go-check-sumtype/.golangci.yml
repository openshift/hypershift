version: "2"
run:
  tests: true
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - dupword
    - err113
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocyclo
    - godoclint
    - godot
    - gomodguard
    - godox
    - govet
    - ireturn
    - lll
    - maintidx
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - nonamedreturns
    - paralleltest
    - perfsprint
    - predeclared
    - revive
    - testableexamples
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    forbidigo:
      exclude-godoc-examples: false
    goconst:
      min-len: 8
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: '^(G104|G204):'
      - path: (.+)\.go$
        text: Error return value of .(.*\.Help|.*\.MarkFlagRequired|(os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: exported method (.*\.MarshalJSON|.*\.UnmarshalJSON|.*\.EntityURN|.*\.GoString|.*\.Pos) should have comment or be unexported
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
      - path: (.+)\.go$
        text: declaration of "err" shadows declaration
      - path: (.+)\.go$
        text: should not use dot imports
      - path: (.+)\.go$
        text: Potential file inclusion via variable
      - path: (.+)\.go$
        text: should have comment or be unexported
      - path: (.+)\.go$
        text: comment on exported var .* should be of the form
      - path: (.+)\.go$
        text: at least one file in a package should have a package comment
      - path: (.+)\.go$
        text: string literal contains the Unicode
      - path: (.+)\.go$
        text: methods on the same type should have the same receiver name
      - path: (.+)\.go$
        text: _TokenType_name should be _TokenTypeName
      - path: (.+)\.go$
        text: '`_TokenType_map` should be `_TokenTypeMap`'
      - path: (.+)\.go$
        text: rewrite if-else to switch statement
    paths:
      - _examples
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - _examples
      - third_party$
      - builtin$
      - examples$
