# ExternalSecret to sync the pull-secret from GCP Secret Manager.
# Modeled on clusters-patmarti-102447/pull-secret. Reuses the same
# GCP Secret Manager entry (default-openshift-pull-secret) — read-only
# reference, no conflict with patmarti-102447.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pull-secret
  namespace: clusters-pat-console
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: default-openshift-pull-secret
      metadataPolicy: None
    secretKey: .dockerconfigjson
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: pull-secret
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
