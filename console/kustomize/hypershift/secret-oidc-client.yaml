# OIDC client secret for the console bridge, mounted as a file for
# -user-auth-oidc-client-secret-file (key: clientSecret). Normally the
# console-operator would obtain this from the guest-synced client secret; with
# no operator we provide it directly. The real value is supplied by the
# per-cluster overlay (secretGenerator from the OAuth client JSON).
apiVersion: v1
kind: Secret
metadata:
  name: console-oidc-client-secret
  labels:
    app: console
type: Opaque
stringData:
  clientSecret: "REPLACE_WITH_OIDC_CLIENT_SECRET"
