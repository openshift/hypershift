# NOT from upstream. Phase 1 has no console-operator, so there is no OIDC/OAuth
# wiring to authenticate end users; a single static guest bearer token is used
# for ALL k8s API calls (-user-auth=disabled). DEV ONLY.
# Real value is minted per-HCP and supplied by the per-cluster overlay (patch
# the `token` key, or replace this whole resource with a secretGenerator).
apiVersion: v1
kind: Secret
metadata:
  name: console-static-token
  labels:
    app: console
type: Opaque
stringData:
  token: "REPLACE_WITH_GUEST_SA_TOKEN"
