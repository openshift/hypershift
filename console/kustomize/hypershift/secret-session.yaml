# Session cookie keys for the console bridge in -user-auth=oidc mode. The
# bridge stores the user's ID token in an encrypted (AES, 32-byte key) and
# signed (HMAC, 64-byte key) cookie via gorilla/securecookie. Normally
# generated by console-operator; the per-cluster overlay replaces these
# placeholders with real random keys (secretGenerator).
apiVersion: v1
kind: Secret
metadata:
  name: console-session
  labels:
    app: console
type: Opaque
stringData:
  encryptionKey: "REPLACE_WITH_32_BYTE_KEY"
  authenticationKey: "REPLACE_WITH_64_BYTE_KEY"
