              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              nodePoolManagementARN: arn:aws:iam::123456789012:role/nodepool
              storageARN: arn:aws:iam::123456789012:role/storage
              networkARN: arn:aws:iam::123456789012:role/network
            managedDNS:
              ingressDomainPrefix: in
              delegation:
                nsDelegation: Manual
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

