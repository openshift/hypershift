apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster CSI driver KMS key validation"
crdName: hostedclusters.hypershift.openshift.io
version: v1beta1
tests:
  onCreate:
  - name: When kmsKeyARN is a valid AWS KMS key ARN it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        operatorConfiguration:
          csiDriverConfig:
            aws:
              kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/mrk-abc123"
        platform:
          type: AWS
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: When kmsKeyARN is a valid alias ARN it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
