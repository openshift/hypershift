apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster autoscaler node behavior configuration validation"
crdName: hostedclusters.hypershift.openshift.io
featureGates:
  - HostedClusterAutoscalerConfiguration
version: v1beta1
tests:
  onCreate:
  - name: When scaleDown.nodesWithLocalStoragePolicy, scaleDown.daemonSetUtilization, and scaleUp.similarNodePoolsBalancing are set to valid values it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        autoscaling:
          scaleDown:
            nodesWithLocalStoragePolicy: Skip
            daemonSetUtilization: Exclude
          scaleUp:
            similarNodePoolsBalancing: None
        dns:
          baseDomain: example.com
        platform:
          type: AWS
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        autoscaling:
          scaling: ScaleUpAndScaleDown
          scaleDown:
            nodesWithLocalStoragePolicy: Skip
            daemonSetUtilization: Exclude
          scaleUp:
            similarNodePoolsBalancing: None
        capabilities: {}
        controllerAvailabilityPolicy: HighlyAvailable
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
              persistentVolume:
                size: 8Gi
        infrastructureAvailabilityPolicy: SingleReplica
        issuerURL: https://kubernetes.default.svc
        networking:
          clusterNetwork:
          - cidr: 10.132.0.0/14
          networkType: OVNKubernetes
          serviceNetwork:
          - cidr: 172.31.0.0/16
        olmCatalogPlacement: management
        platform:
          type: AWS
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: OAuthServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Konnectivity
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Ignition
          servicePublishingStrategy:
            route: {}
            type: Route

