apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster operatorConfiguration kubeAPIServer eventTTLMinutes"
crdName: hostedclusters.hypershift.openshift.io
featureGates:
  - KubeAPIServerEventTTL
version: v1beta1
tests:
  onCreate:
  - name: When eventTTLMinutes is the minimum of 5 it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
              operatorConfiguration:
                kubeAPIServer:
                  eventTTLMinutes: 5
              dns:
                baseDomain: example.com
              platform:
                type: AWS
              pullSecret:
                name: secret
              release:
                image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
              secretEncryption:
                aescbc:
                  activeKey:
                    name: key
                type: aescbc
              services:
              - service: APIServer
                servicePublishingStrategy:
                  type: Route
                  route: {}
              - service: OAuthServer
                servicePublishingStrategy:
                  type: Route
                  route: {}
              - service: Konnectivity
                servicePublishingStrategy:
                  type: Route
                  route: {}
              - service: Ignition
                servicePublishingStrategy:
                  type: Route
                  route: {}

  - name: When eventTTLMinutes is the maximum of 180 it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
