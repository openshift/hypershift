                  route: {}
              - service: Konnectivity
                servicePublishingStrategy:
                  type: Route
                  route: {}
              - service: Ignition
                servicePublishingStrategy:
                  type: Route
                  route: {}

  - name: When eventTTLMinutes is within the range it should pass
