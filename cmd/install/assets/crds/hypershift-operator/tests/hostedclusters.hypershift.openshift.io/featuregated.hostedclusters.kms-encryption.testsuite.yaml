apiVersion: apiextensions.k8s.io/v1
name: HostedCluster legacy KMS encryption compatibility
crdName: hostedclusters.hypershift.openshift.io
crdFeatureSet: CustomNoUpgrade
version: v1beta1
tests:
  onCreate:
  - name: When legacy inline Vault KMS configuration is provided, it should succeed
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        capabilities: {}
        controllerAvailabilityPolicy: HighlyAvailable
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
              persistentVolume:
                size: 8Gi
        infrastructureAvailabilityPolicy: SingleReplica
        issuerURL: https://kubernetes.default.svc
        networking:
          networkType: OVNKubernetes
          clusterNetwork:
          - cidr: 10.132.0.0/14
          serviceNetwork:
          - cidr: 172.31.0.0/16
        olmCatalogPlacement: management
        platform:
          type: None
        pullSecret:
          name: pull-secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.22.0-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        configuration:
          apiServer:
            audit:
              profile: Default
            encryption:
              type: KMS
              kms:
                type: Vault
                vault:
                  kmsPluginImage: quay.io/hashicorp/vault-k8s@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  vaultAddress: https://vault.example.com:8200
                  authentication:
                    type: AppRole
                    appRole:
                      secret:
                        name: vault-credentials
                  vaultKeyPath: transit/keys/test-key

  - name: When pluginConfig-only KMS configuration is provided to the legacy schema, it should fail instead of being silently pruned
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: None
        pullSecret:
          name: pull-secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.22.0-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        configuration:
          apiServer:
            audit:
              profile: Default
            encryption:
              type: KMS
              kms:
                pluginConfig:
                  apiVersion: config.openshift.io/v1
                  resource: vaultkmsconfigs
                  name: cluster
    expectedError: "spec.configuration.apiServer.encryption.kms.type: Required value"

