apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster AWS resource tag validation"
crdName: hostedclusters.hypershift.openshift.io
version: v1beta1
tests:
  onCreate:
  # --- AWS resourceTags validation ---
  - name: when resourceTags have valid key and value with overridePolicy Allow it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: AWS
          aws:
            region: us-east-1
            rolesRef:
              controlPlaneOperatorARN: arn:aws:iam::123456789012:role/cpo
              imageRegistryARN: arn:aws:iam::123456789012:role/image
              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              networkARN: arn:aws:iam::123456789012:role/network
              nodePoolManagementARN: arn:aws:iam::123456789012:role/npm
              storageARN: arn:aws:iam::123456789012:role/storage
            resourceTags:
              - key: env
                value: prod
                overridePolicy: Allow
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: when resourceTags have valid key and value with overridePolicy Deny it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: AWS
          aws:
            region: us-east-1
            rolesRef:
              controlPlaneOperatorARN: arn:aws:iam::123456789012:role/cpo
              imageRegistryARN: arn:aws:iam::123456789012:role/image
              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              networkARN: arn:aws:iam::123456789012:role/network
              nodePoolManagementARN: arn:aws:iam::123456789012:role/npm
              storageARN: arn:aws:iam::123456789012:role/storage
            resourceTags:
              - key: env
                value: prod
                overridePolicy: Deny
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: when resourceTags have valid key and value without overridePolicy it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: AWS
          aws:
            region: us-east-1
            rolesRef:
              controlPlaneOperatorARN: arn:aws:iam::123456789012:role/cpo
              imageRegistryARN: arn:aws:iam::123456789012:role/image
              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              networkARN: arn:aws:iam::123456789012:role/network
              nodePoolManagementARN: arn:aws:iam::123456789012:role/npm
              storageARN: arn:aws:iam::123456789012:role/storage
            resourceTags:
              - key: env
                value: prod
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: when resourceTag key contains invalid characters it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: AWS
          aws:
            region: us-east-1
            rolesRef:
              controlPlaneOperatorARN: arn:aws:iam::123456789012:role/cpo
              imageRegistryARN: arn:aws:iam::123456789012:role/image
              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              networkARN: arn:aws:iam::123456789012:role/network
              nodePoolManagementARN: arn:aws:iam::123456789012:role/npm
              storageARN: arn:aws:iam::123456789012:role/storage
            resourceTags:
              - key: "invalid!key"
                value: prod
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "key must only contain letters, digits, and the characters _ . : / = + - @"

  - name: when resourceTag value contains invalid characters it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: AWS
          aws:
            region: us-east-1
            rolesRef:
              controlPlaneOperatorARN: arn:aws:iam::123456789012:role/cpo
              imageRegistryARN: arn:aws:iam::123456789012:role/image
              ingressARN: arn:aws:iam::123456789012:role/ingress
              kubeCloudControllerARN: arn:aws:iam::123456789012:role/kcc
              networkARN: arn:aws:iam::123456789012:role/network
              nodePoolManagementARN: arn:aws:iam::123456789012:role/npm
              storageARN: arn:aws:iam::123456789012:role/storage
            resourceTags:
              - key: env
                value: "invalid#value"
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "value must only contain letters, digits, and the characters _ . : / = + - @"
