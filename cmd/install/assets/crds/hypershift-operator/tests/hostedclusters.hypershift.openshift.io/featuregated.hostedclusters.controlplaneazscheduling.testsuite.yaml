apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster control plane availability-zone scheduling validation"
crdName: hostedclusters.hypershift.openshift.io
featureGates:
  - ControlPlaneAvailabilityZoneScheduling
version: v1beta1
tests:
  onCreate:
  - name: Minimal policy on Azure HighlyAvailable is allowed
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        controllerAvailabilityPolicy: HighlyAvailable
        controlPlaneAvailabilityZoneScheduling:
          policy: Minimal
          nonZonalPlacement: Preferred
        dns:
          baseDomain: example.com
        platform:
          type: Azure
          azure:
            cloud: AzurePublicCloud
            location: eastus
            resourceGroupName: test-rg
            vnetID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/virtualNetworks/test-vnet"
            subnetID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/virtualNetworks/test-vnet/subnets/test-subnet"
            subscriptionID: "12345678-1234-5678-9012-123456789012"
            securityGroupID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/networkSecurityGroups/test-nsg"
            tenantID: "87654321-4321-8765-2109-876543210987"
            azureAuthenticationConfig:
              azureAuthenticationConfigType: WorkloadIdentities
              workloadIdentities:
                imageRegistry:
                  clientID: "12345678-1234-5678-9012-123456789012"
                ingress:
                  clientID: "12345678-1234-5678-9012-123456789012"
                file:
                  clientID: "12345678-1234-5678-9012-123456789012"
                disk:
                  clientID: "12345678-1234-5678-9012-123456789012"
                nodePoolManagement:
                  clientID: "12345678-1234-5678-9012-123456789012"
                cloudProvider:
                  clientID: "12345678-1234-5678-9012-123456789012"
                network:
                  clientID: "12345678-1234-5678-9012-123456789012"
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: Minimal policy with SingleReplica should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        controllerAvailabilityPolicy: SingleReplica
        controlPlaneAvailabilityZoneScheduling:
          policy: Minimal
        dns:
          baseDomain: example.com
        platform:
          type: Azure
          azure:
            cloud: AzurePublicCloud
            location: eastus
            resourceGroupName: test-rg
            vnetID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/virtualNetworks/test-vnet"
            subnetID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/virtualNetworks/test-vnet/subnets/test-subnet"
            subscriptionID: "12345678-1234-5678-9012-123456789012"
            securityGroupID: "/subscriptions/12345678-1234-5678-9012-123456789012/resourceGroups/test-rg/providers/Microsoft.Network/networkSecurityGroups/test-nsg"
            tenantID: "87654321-4321-8765-2109-876543210987"
            azureAuthenticationConfig:
              azureAuthenticationConfigType: WorkloadIdentities
              workloadIdentities:
                imageRegistry:
                  clientID: "12345678-1234-5678-9012-123456789012"
                ingress:
                  clientID: "12345678-1234-5678-9012-123456789012"
                file:
                  clientID: "12345678-1234-5678-9012-123456789012"
                disk:
                  clientID: "12345678-1234-5678-9012-123456789012"
                nodePoolManagement:
                  clientID: "12345678-1234-5678-9012-123456789012"
                cloudProvider:
                  clientID: "12345678-1234-5678-9012-123456789012"
                network:
                  clientID: "12345678-1234-5678-9012-123456789012"
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "controlPlaneAvailabilityZoneScheduling can only be set when controllerAvailabilityPolicy is HighlyAvailable"

  - name: Minimal policy on a non-Azure platform should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        controllerAvailabilityPolicy: HighlyAvailable
        controlPlaneAvailabilityZoneScheduling:
          policy: Minimal
        dns:
          baseDomain: example.com
        platform:
          type: AWS
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        secretEncryption:
          aescbc:
            activeKey:
              name: key
          type: aescbc
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "controlPlaneAvailabilityZoneScheduling is only supported on the Azure platform"
