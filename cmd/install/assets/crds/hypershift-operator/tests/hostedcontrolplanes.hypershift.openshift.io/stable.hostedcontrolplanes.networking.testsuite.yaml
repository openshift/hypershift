apiVersion: apiextensions.k8s.io/v1
name: "HostedControlPlane networking validation"
crdName: hostedcontrolplanes.hypershift.openshift.io
version: v1beta1
tests:
  onCreate:
  # --- networkType open-string validation ---
  - name: When networkType is an arbitrary third-party value it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          networkType: "Cilium"
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: When networkType is empty it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          networkType: ""
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: 'should be at least 1 chars long'

  # --- allocateNodeCIDRs validation (ClusterNetworking, shared with HostedCluster) ---
  - name: When allocateNodeCIDRs is Enabled and networkType is Other it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          allocateNodeCIDRs: Enabled
          networkType: Other
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: When allocateNodeCIDRs is Enabled and networkType is not a third-party CNI it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          allocateNodeCIDRs: Enabled
          networkType: OVNKubernetes
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "allocateNodeCIDRs can only be set to Enabled when networkType is a third-party CNI (any value other than OpenShiftSDN or OVNKubernetes)"

  - name: When allocateNodeCIDRs is Enabled and networkType is a third-party CNI it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          allocateNodeCIDRs: Enabled
          networkType: Calico
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}

  # --- disableMultiNetwork validation (HostedControlPlane spec-level rule) ---
  - name: When disableMultiNetwork is true and networkType is Other it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          networkType: Other
        operatorConfiguration:
          clusterNetworkOperator:
            disableMultiNetwork: true
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}

  - name: When disableMultiNetwork is true and networkType is not a third-party CNI it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          networkType: OVNKubernetes
        operatorConfiguration:
          clusterNetworkOperator:
            disableMultiNetwork: true
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "disableMultiNetwork can only be set to true when networkType is a third-party CNI (any value other than OpenShiftSDN or OVNKubernetes)"

  - name: When disableMultiNetwork is true and networkType is a third-party CNI it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        networking:
          networkType: Calico
        operatorConfiguration:
          clusterNetworkOperator:
            disableMultiNetwork: true
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.18.0-x86_64
        pullSecret:
          name: pull-secret
        issuerURL: https://issuer.example.com
        sshKey:
          name: ssh-key
        infraID: example-abcde
        platform:
          type: None
        dns:
          baseDomain: example.com
        etcd:
          managementType: Managed
          managed:
            storage:
              type: PersistentVolume
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
