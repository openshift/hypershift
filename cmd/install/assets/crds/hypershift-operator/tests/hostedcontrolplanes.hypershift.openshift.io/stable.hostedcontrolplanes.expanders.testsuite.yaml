        dns:
          baseDomain: example.com
        etcd:
          managed:
            storage:
              persistentVolume:
                size: 8Gi
              type: PersistentVolume
          managementType: Managed
        infraID: expanders-test
        issuerURL: https://kubernetes.default.svc
        platform:
          type: AWS
        pullSecret:
          name: secret
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: OAuthServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Konnectivity
          servicePublishingStrategy:
            route: {}
