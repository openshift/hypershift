        sshKey:
          name: ssh-key
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      spec:
        autoscaling:
          expanders:
          - LeastWaste
          - LeastWaste
        dns:
          baseDomain: example.com
        etcd:
          managed:
            storage:
              persistentVolume:
