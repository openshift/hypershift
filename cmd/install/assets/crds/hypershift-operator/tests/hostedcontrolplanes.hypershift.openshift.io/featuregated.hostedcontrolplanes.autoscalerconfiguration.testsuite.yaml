apiVersion: apiextensions.k8s.io/v1
name: "HostedControlPlane autoscaler node behavior configuration validation"
crdName: hostedcontrolplanes.hypershift.openshift.io
featureGates:
  - HostedClusterAutoscalerConfiguration
version: v1beta1
tests:
  onCreate:
  - name: When scaleDown.nodesWithLocalStoragePolicy, scaleDown.daemonSetUtilization, and scaleUp.similarNodePoolsBalancing are set to valid values it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      metadata:
        name: autoscaler-oncreate-0
        namespace: default
      spec:
        autoscaling:
          scaleDown:
            nodesWithLocalStoragePolicy: Skip
            daemonSetUtilization: Exclude
          scaleUp:
            similarNodePoolsBalancing: None
        capabilities: {}
        controllerAvailabilityPolicy: HighlyAvailable
        dns:
          baseDomain: example.com
        etcd:
          managed:
            storage:
              persistentVolume:
                size: 8Gi
              type: PersistentVolume
          managementType: Managed
        infraID: autoscaler-test
        infrastructureAvailabilityPolicy: SingleReplica
        issuerURL: https://kubernetes.default.svc
        olmCatalogPlacement: management
        platform:
          type: AWS
        pullSecret:
          name: secret
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.16.0-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: OAuthServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Konnectivity
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Ignition
          servicePublishingStrategy:
            route: {}
            type: Route
        sshKey:
          name: ssh-key
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedControlPlane
      metadata:
        name: autoscaler-oncreate-0
        namespace: default
      spec:
        autoscaling:
          scaling: ScaleUpAndScaleDown
          scaleDown:
            nodesWithLocalStoragePolicy: Skip
            daemonSetUtilization: Exclude
          scaleUp:
            similarNodePoolsBalancing: None
        capabilities: {}
        controllerAvailabilityPolicy: HighlyAvailable
        dns:
          baseDomain: example.com
        etcd:
          managed:
            storage:
              persistentVolume:
                size: 8Gi
              type: PersistentVolume
          managementType: Managed
        infraID: autoscaler-test
        infrastructureAvailabilityPolicy: SingleReplica
        issuerURL: https://kubernetes.default.svc
        olmCatalogPlacement: management
        platform:
          type: AWS
        pullSecret:
          name: secret
        releaseImage: quay.io/openshift-release-dev/ocp-release:4.16.0-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: OAuthServer
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Konnectivity
          servicePublishingStrategy:
            route: {}
            type: Route
        - service: Ignition
          servicePublishingStrategy:
            route: {}
            type: Route
        sshKey:
          name: ssh-key

