apiVersion: apiextensions.k8s.io/v1
name: "NodePool ratcheting validation"
crdName: nodepools.hypershift.openshift.io
version: v1beta1
tests:
  onUpdate:
  # Legacy NodePools created before the management.replace CRD default was removed may already
  # have management.replace populated even when upgradeType is InPlace, because the old default
  # was applied unconditionally. The management XValidation rule that now rejects that combination
  # must ratchet so those pre-existing objects can still be updated on unrelated fields.
  - name: When updating an unrelated field on a legacy InPlace NodePool that has replace set it should pass
    initialCRDPatches:
      # Remove the "replace can only be set when upgradeType is Replace" rule so the invalid
      # legacy object can be created, simulating an object persisted under the old schema.
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/management/x-kubernetes-validations/1
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 1
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 1
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS

  - name: When remediating a legacy InPlace NodePool by removing the stray replace field it should pass
    initialCRDPatches:
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/management/x-kubernetes-validations/1
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          upgradeType: InPlace
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: InPlace
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS

  - name: When changing the management block of a legacy InPlace NodePool while the stray replace field remains it should fail
    initialCRDPatches:
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/management/x-kubernetes-validations/1
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: true
          upgradeType: InPlace
          replace:
            strategy: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.17.0-rc.0-x86_64
        replicas: 0
        platform:
          aws:
            instanceProfile: a-profile
            instanceType: m6a.2xlarge
            rootVolume:
              size: 120
              type: gp3
            subnet:
              id: "subnet-any"
          type: AWS
    expectedError: "The 'replace' field can only be set when 'upgradeType' is 'Replace'"
