apiVersion: apiextensions.k8s.io/v1
name: "AWSEndpointService AWS validation"
crdName: awsendpointservices.hypershift.openshift.io
version: v1beta1
tests:
  onCreate:
  - name: when resourceTags are set on AWSEndpointService it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: AWSEndpointService
      spec:
        networkLoadBalancerName: my-nlb
        resourceTags:
          - key: env
            value: prod
