apiVersion: apiextensions.k8s.io/v1
name: "AWSEndpointService AWS validation"
crdName: awsendpointservices.hypershift.openshift.io
version: v1beta1
tests:
  onCreate:
  # --- AWS Resource Tag OverridePolicy validation ---
  - name: when resourceTag overridePolicy is set on AWSEndpointService it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: AWSEndpointService
      spec:
        networkLoadBalancerName: my-nlb
        resourceTags:
          - key: env
            value: prod
            overridePolicy: Allow
    expectedError: "overridePolicy is not supported on AWSEndpointService-level tags"

  - name: when resourceTag overridePolicy is omitted on AWSEndpointService it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: AWSEndpointService
      spec:
        networkLoadBalancerName: my-nlb
        resourceTags:
          - key: env
            value: prod
