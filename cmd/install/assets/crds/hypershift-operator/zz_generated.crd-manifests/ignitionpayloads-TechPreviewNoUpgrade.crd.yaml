apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api.openshift.io/merged-by-featuregates: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-set: TechPreviewNoUpgrade
  name: ignitionpayloads.hypershift.openshift.io
spec:
  group: hypershift.openshift.io
  names:
    kind: IgnitionPayload
    listKind: IgnitionPayloadList
    plural: ignitionpayloads
    shortNames:
    - ignpayload
    singular: ignitionpayload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.current.generation
      name: Generation
      type: integer
    - jsonPath: .status.conditions[?(@.type=="PayloadGenerated")].status
      name: Generated
      type: string
    - jsonPath: .status.conditions[?(@.type=="IgnitionReached")].status
      name: Reached
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          IgnitionPayload is one consumer's ignition payload request: the consumer's
          inputs in spec, the generator's results in status. One resource exists per
          consumer request (one per NodePool for the NodePool controller; Karpenter
          creates its own on demand). The type is consumer-agnostic — it carries no
          back-reference to a NodePool so non-NodePool consumers can use it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is written by the consumer and describes the desired
              payload inputs.
            properties:
              additionalTrustBundle:
                description: |-
                  additionalTrustBundle optionally references a ConfigMap in the CR's
                  namespace holding a PEM CA bundle for booting nodes to trust.
                properties:
                  name:
                    description: name is the name of a ConfigMap in the same namespace
                      as this resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              mgmtConfigMaps:
                description: |-
                  mgmtConfigMaps lists ConfigMaps in the CR's namespace whose contents are
                  management-side only (the apiserver-HAProxy config).
                items:
                  description: ConfigMapReference references a ConfigMap by name in
                    the CR's namespace.
                  properties:
                    name:
                      description: name is the name of a ConfigMap in the same namespace
                        as this resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              osStream:
                description: osStream selects the RHEL OS stream the payload targets.
                enum:
                - rhel-9
                - rhel-10
                type: string
              pullSecretName:
                description: |-
                  pullSecretName is the name of a Secret in the CR's namespace holding the
                  registry pull secret used to fetch the release image and embedded in the
                  payload.
                maxLength: 253
                minLength: 1
                type: string
              releaseImage:
                description: |-
                  releaseImage is the pullspec of the OCP release whose
                  machine-config-server binaries render the payload.
                maxLength: 447
                minLength: 1
                type: string
              retiredGeneration:
                description: |-
                  retiredGeneration is a level-triggered signal that the payload of the
                  given generation has drained and its store token may be freed.
                format: int64
                minimum: 1
                type: integer
              rolloutConfigMaps:
                description: |-
                  rolloutConfigMaps lists ConfigMaps in the CR's namespace whose contents
                  are rollout-relevant (user, core, and NTO machine configs).
                items:
                  description: ConfigMapReference references a ConfigMap by name in
                    the CR's namespace.
                  properties:
                    name:
                      description: name is the name of a ConfigMap in the same namespace
                        as this resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rolloutGlobalConfig:
                description: |-
                  rolloutGlobalConfig references a CR-owned ConfigMap in the CR's namespace
                  holding the rollout-relevant subset of the hosted cluster's global
                  configuration, canonicalized and authored by the consumer.
                properties:
                  name:
                    description: name is the name of a ConfigMap in the same namespace
                      as this resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - pullSecretName
            - releaseImage
            type: object
          status:
            description: |-
              status is written by the PayloadController and reports generation and
              rollout progress.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions reports generation and rollout progress. Known types:
                  "PayloadGenerated" and "IgnitionReached".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: current describes the payload for the latest validated,
                  generated config.
                properties:
                  configHash:
                    description: configHash is the payload-identity hash over the
                      whole validated config.
                    maxLength: 64
                    minLength: 1
                    type: string
                  generation:
                    description: |-
                      generation is a monotonically increasing counter the consumer watches to
                      execute a rollout. It advances only when rolloutHash changes.
                    format: int64
                    minimum: 1
                    type: integer
                  rolloutHash:
                    description: rolloutHash is the hash over the rollout-relevant
                      inputs.
                    maxLength: 64
                    minLength: 1
                    type: string
                  token:
                    description: 'token is an opaque, non-derivable UUID: the key
                      into the PayloadStore.'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - configHash
                - generation
                - rolloutHash
                - token
                type: object
              previous:
                description: |-
                  previous describes the immediately prior payload, retained during a
                  rollout so in-flight boots on the old token are served until they drain.
                properties:
                  configHash:
                    description: configHash is the payload-identity hash over the
                      whole validated config.
                    maxLength: 64
                    minLength: 1
                    type: string
                  generation:
                    description: |-
                      generation is a monotonically increasing counter the consumer watches to
                      execute a rollout. It advances only when rolloutHash changes.
                    format: int64
                    minimum: 1
                    type: integer
                  rolloutHash:
                    description: rolloutHash is the hash over the rollout-relevant
                      inputs.
                    maxLength: 64
                    minLength: 1
                    type: string
                  token:
                    description: 'token is an opaque, non-derivable UUID: the key
                      into the PayloadStore.'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - configHash
                - generation
                - rolloutHash
                - token
                type: object
              rolloutHashVersion:
                description: |-
                  rolloutHashVersion identifies the formula version used to compute
                  current.rolloutHash.
                format: int64
                minimum: 1
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
