name: Create Tag

on:
  push:
    branches:
      - main
    paths:
      - releases/tags.yaml
  workflow_dispatch: {}

jobs:
  create-tag:
    if: github.ref == 'refs/heads/main'
    uses: openshift/hypershift/.github/workflows/create-tag-reusable.yaml@main
    permissions:
      contents: read
    secrets: inherit
