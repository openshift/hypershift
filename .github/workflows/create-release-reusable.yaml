name: Create Release (Reusable)

on:
  workflow_call:
    inputs:
      tag-name:
        description: 'Tag name to create a release for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag name
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          if ! echo "$TAG_NAME" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?$'; then
            echo "::error::Tag '$TAG_NAME' does not match semver format"
            exit 1
          fi
      - name: Install git-cliff
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
          GIT_CLIFF_VERSION: "2.7.0"
        run: |
          case "$(uname -m)" in
            x86_64)  CLIFF_ARCH="x86_64";  CLIFF_SHA256="d9705c9f43bd74e2d10ca7df10b624bbe6f15bd4774f6c1e012db5be276f91f7" ;;
            aarch64) CLIFF_ARCH="aarch64"; CLIFF_SHA256="545eb07f032882250db0b699cd62a078e12a8025bda1fe250a30efe9230a619d" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-${CLIFF_ARCH}-unknown-linux-gnu.tar.gz" \
            -o /tmp/git-cliff.tar.gz
          echo "${CLIFF_SHA256}  /tmp/git-cliff.tar.gz" | sha256sum -c -
          tar xzf /tmp/git-cliff.tar.gz -C /tmp
          mkdir -p "$INSTALL_DIR"
          mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" "${INSTALL_DIR}/git-cliff"
          chmod +x "${INSTALL_DIR}/git-cliff"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Generate release notes
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          set -euo pipefail

          prev_tag=$(git tag --sort=-v:refname --merged "${TAG_NAME}^" | head -1)

          if [ -n "$prev_tag" ]; then
            git cliff "${prev_tag}..${TAG_NAME}" --tag "$TAG_NAME" -o /tmp/release-notes.md
          else
            echo "Initial release ${TAG_NAME}" > /tmp/release-notes.md
          fi

          echo "--- Release notes ---"
          cat /tmp/release-notes.md
      - name: Build source tarball
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          git archive --format=tar.gz --prefix="hypershift-${TAG_NAME}/" \
            -o "hypershift-${TAG_NAME}-source.tar.gz" "$TAG_NAME"
          sha256sum "hypershift-${TAG_NAME}-source.tar.gz" \
            > "hypershift-${TAG_NAME}-source.tar.gz.sha256"
      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          gh release create "$TAG_NAME" \
            --draft \
            --title "$TAG_NAME" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            "hypershift-${TAG_NAME}-source.tar.gz" \
            "hypershift-${TAG_NAME}-source.tar.gz.sha256"

          echo "## Create Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft release **${TAG_NAME}** created." >> "$GITHUB_STEP_SUMMARY"
