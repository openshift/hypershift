name: Build and Push Azure CLI Base Image

on:
  schedule:
    # Run weekly Monday 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.ci.openshift.org
        uses: docker/login-action@v3
        with:
          registry: registry.ci.openshift.org
          username: ${{ secrets.REGISTRY_CI_USERNAME }}
          password: ${{ secrets.REGISTRY_CI_PASSWORD }}

      - name: Generate immutable image tag
        id: image-tag
        run: echo "tag=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push azure-cli-base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.azure-cli-base
          push: true
          tags: |
            registry.ci.openshift.org/openshift/hypershift/azure-cli-base:${{ steps.image-tag.outputs.tag }}
            registry.ci.openshift.org/openshift/hypershift/azure-cli-base:${{ github.run_number }}
          cache-from: type=registry,ref=registry.ci.openshift.org/openshift/hypershift/azure-cli-base:${{ steps.image-tag.outputs.tag }}
          cache-to: type=inline

      - name: Verify image and azure-cli installation
        run: |
          docker run --rm registry.ci.openshift.org/openshift/hypershift/azure-cli-base:${{ steps.image-tag.outputs.tag }} \
            bash -c 'azure --version && echo "✓ Azure CLI verification passed"'
