name: Lint

on:
  pull_request:
    branches:
      - main
      - release-4.22

jobs:
  lint:
    uses: ./.github/workflows/verify-reusable.yaml
    with:
      target: lint
    permissions:
      contents: read
  lint-macos:
    if: github.base_ref == 'main'
    uses: ./.github/workflows/verify-reusable.yaml
    with:
      target: lint
      runner: macos-15
    permissions:
      contents: read
