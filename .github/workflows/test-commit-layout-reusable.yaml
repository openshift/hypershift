name: Unit Tests (Restructure Commits) (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-commit-layout:
    name: Restructure Commits
    runs-on: arc-runner-set
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-commit-layout
