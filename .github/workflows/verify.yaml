name: Verify

on:
  pull_request:
    branches:
      - main
      - release-4.22

jobs:
  verify:
    uses: ./.github/workflows/verify-reusable.yaml
    with:
      target: verify-repository
    permissions:
      contents: read
  verify-macos:
    if: github.base_ref == 'main'
    uses: ./.github/workflows/verify-reusable.yaml
    with:
      runner: macos-15
      target: verify-repository
    permissions:
      contents: read
