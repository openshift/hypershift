name: Deadcode (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deadcode:
    name: Deadcode
    runs-on: arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hack/tools/bin
          key: deadcode-tools-${{ hashFiles('Makefile', 'hack/tools/go.mod', 'hack/tools/go.sum', 'hack/tools/tools.go', 'hack/tools/vendor/modules.txt', 'hack/tools/deadcode-report/**/*.go') }}
      - name: Run deadcode gate
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/deadcode
        run: make verify-deadcode
      - name: Upload deadcode report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deadcode-report
          path: ${{ runner.temp }}/deadcode
          if-no-files-found: ignore
