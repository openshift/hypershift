name: Create Tag (Reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  create-tag:
    name: Create Tag
    runs-on: arc-runner-set
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yq
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          YQ_VERSION="v4.44.6"
          case "$(uname -m)" in
            x86_64)  YQ_ARCH="amd64"; YQ_SHA256="0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598" ;;
            aarch64) YQ_ARCH="arm64"; YQ_SHA256="9477ac3cc447b6c083986129e35af8122eb2b938fe55c9c3e40436fb966e5813" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$INSTALL_DIR"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${YQ_ARCH}" -o "${INSTALL_DIR}/yq"
          echo "${YQ_SHA256}  ${INSTALL_DIR}/yq" | sha256sum -c -
          chmod +x "${INSTALL_DIR}/yq"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.JIRA_SOLVE_CI_APP_ID }}
          private-key: ${{ secrets.JIRA_SOLVE_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
      - name: Reconcile tags
        id: reconcile
        run: |
          set -euo pipefail

          tag_count=$(yq '.tags | length' releases/tags.yaml)

          if [ "$tag_count" -eq 0 ]; then
            echo "No tags defined in releases/tags.yaml."
            echo "## Create Tag" >> "$GITHUB_STEP_SUMMARY"
            echo "No tags defined in \`releases/tags.yaml\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          created=0
          skipped=0

          for i in $(seq 0 $((tag_count - 1))); do
            name=$(yq ".tags[$i].name" releases/tags.yaml)
            commit=$(yq ".tags[$i].commit" releases/tags.yaml)
            description=$(yq ".tags[$i].description" releases/tags.yaml)

            # Skip tags that already exist.
            if git rev-parse "refs/tags/$name" >/dev/null 2>&1; then
              echo "Tag '$name' already exists, skipping."
              skipped=$((skipped + 1))
              continue
            fi

            echo "Creating annotated tag '$name' at commit '$commit'..."
            git tag -a "$name" "$commit" -m "$description"
            git push origin "$name"
            echo "Tag '$name' created and pushed."
            created=$((created + 1))
          done

          echo "## Create Tag" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Created:** $created tag(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skipped (already exist):** $skipped tag(s)" >> "$GITHUB_STEP_SUMMARY"
