name: Claude on PR (reusable)

on:
  workflow_call:
    inputs:
      command-name:
        description: Concurrency group prefix and label for the command
        type: string
        required: true
      status-message:
        description: Text for the PR status comment (e.g. "Rebasing PR onto main")
        type: string
        required: true
      claude-prompt:
        description: The prompt passed to Claude via -p
        type: string
        required: true
      max-turns:
        description: Maximum number of Claude turns
        type: number
        default: 200
      allowed-tools:
        description: Space-separated list of allowed Claude tools
        type: string
        default: "Bash Read Write Edit Grep Glob WebFetch"
      trusted-files:
        description: >-
          Space-separated list of repository-root-relative files to load from trusted
          upstream/main (e.g. ".claude/skills/restructure-commits/SKILL.md
          skills/git-commit-format/SKILL.md")
        type: string
        default: ""

jobs:
  run:
    concurrency:
      group: ${{ inputs.command-name }}-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: arc-runner-set
    timeout-minutes: 90
    env:
      HOME: /tmp
    steps:
      - name: Link to run
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_MESSAGE: ${{ inputs.status-message }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 ${STATUS_MESSAGE}: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Get PR ref
        id: pr
        run: |
          curl -fsSL -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" > /tmp/pr.json
          echo "branch=$(jq -r '.head.ref' /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.head.repo.full_name' /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      - name: Select token for PR repo
        id: token
        env:
          PR_REPO: ${{ steps.pr.outputs.repo }}
        run: |
          if [[ "$PR_REPO" == "hypershift-community/hypershift" ]]; then
            echo "use_fork_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_fork_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate community fork token
        if: steps.token.outputs.use_fork_token == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.JIRA_SOLVE_CI_APP_ID }}
          private-key: ${{ secrets.JIRA_SOLVE_CI_PRIVATE_KEY }}
          owner: hypershift-community
          repositories: hypershift

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          repository: ${{ steps.pr.outputs.repo }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Add trusted upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags upstream main

      - name: Load trusted files from upstream/main
        if: inputs.trusted-files != ''
        env:
          TRUSTED_FILES: ${{ inputs.trusted-files }}
        run: |
          set -euo pipefail
          TRUSTED_COMMIT="$(git rev-parse --verify 'refs/remotes/upstream/main^{commit}')"
          echo "Trusted upstream/main commit: $TRUSTED_COMMIT"
          : > /tmp/trusted-system-prompt.md
          read -r -a trusted_files <<< "$TRUSTED_FILES"
          for file in "${trusted_files[@]}"; do
            case "$file" in
              ""|/*|.|..|./*|../*|*/./*|*/../*|*/..)
                echo "::error::Trusted file must be a repository-root-relative path without traversal: $file"
                exit 1
                ;;
            esac
            if ! git cat-file -e "$TRUSTED_COMMIT:$file"; then
              echo "::error::Trusted file is absent from upstream/main: $file"
              exit 1
            fi
            if [[ "$(git cat-file -t "$TRUSTED_COMMIT:$file")" != "blob" ]]; then
              echo "::error::Trusted path is not a regular file: $file"
              exit 1
            fi
            if ! git ls-tree --full-tree "$TRUSTED_COMMIT" -- "$file" | grep -Eq '^(100644|100755) blob[[:space:]]'; then
              echo "::error::Trusted path is not a regular file: $file"
              exit 1
            fi
            echo "--- Loading $file from trusted upstream/main ---"
            git show "$TRUSTED_COMMIT:$file" >> /tmp/trusted-system-prompt.md
            printf '\n---\n' >> /tmp/trusted-system-prompt.md
          done

      - name: Assert canonical trusted commit-format skill
        if: inputs.trusted-files != '' && contains(inputs.trusted-files, 'skills/git-commit-format/SKILL.md')
        run: |
          set -euo pipefail
          if ! grep -Fq '# Git Commit Message Formatting Rules' /tmp/trusted-system-prompt.md; then
            echo '::error::Trusted prompt is missing the canonical commit-format skill'
            exit 1
          fi
          if grep -Fq 'Read and follow the canonical commit-format policy' /tmp/trusted-system-prompt.md; then
            echo '::error::Trusted prompt contains the local Claude adapter redirect'
            exit 1
          fi

      - name: Authenticate to GCP via WIF
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: hosted-control-planes
          service_account: claude-gha@hosted-control-planes.iam.gserviceaccount.com
          workload_identity_provider: projects/21066242673/locations/global/workloadIdentityPools/itpc-identity-pool/providers/github-com

      - name: Move GCP credentials out of workspace
        run: |
          install -m 0600 "${{ steps.gcp-auth.outputs.credentials_file_path }}" "$RUNNER_TEMP/gcp-credentials.json"
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$RUNNER_TEMP/gcp-credentials.json" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-credentials.json" >> "$GITHUB_ENV"
          echo "GOOGLE_GHA_CREDS_PATH=$RUNNER_TEMP/gcp-credentials.json" >> "$GITHUB_ENV"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tool dependencies
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          pip install --break-system-packages pre-commit
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Claude
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          CLOUD_ML_REGION: global
          ANTHROPIC_VERTEX_PROJECT_ID: hosted-control-planes
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CLAUDE_PROMPT: ${{ inputs.claude-prompt }}
          MAX_TURNS: ${{ inputs.max-turns }}
          ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: |
          claude plugin marketplace add openshift-eng/ai-helpers
          claude plugin install openshift-developer@ai-helpers
          claude --version
          TRUSTED_PROMPT_ARGS=""
          if [[ -f /tmp/trusted-system-prompt.md ]]; then
            TRUSTED_PROMPT_ARGS="--append-system-prompt-file /tmp/trusted-system-prompt.md"
          fi
          claude -p "$CLAUDE_PROMPT" --bare $TRUSTED_PROMPT_ARGS --model claude-opus-4-6 --max-turns "$MAX_TURNS" --allowedTools "$ALLOWED_TOOLS" --verbose --output-format stream-json

      - name: Push changes
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.REBASE_PUSH_TOKEN || github.token }}
          PR_REPO: ${{ steps.pr.outputs.repo }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${PR_REPO}.git"
          if git -c core.hooksPath=/dev/null push --force-with-lease origin "HEAD:${PR_BRANCH}" >/tmp/push.log 2>&1; then
            cat /tmp/push.log
            exit 0
          fi
          cat /tmp/push.log

          # Neither GITHUB_TOKEN nor a token lacking workflow scope may push commits touching
          # .github/workflows/, even when those commits come from upstream main rather than the
          # PR itself. Syncing the fork's default branch makes them already-present, so the next
          # push carries only PR commits. GitHub words this rejection differently per credential
          # type ("workflows permission" for app tokens, "workflow scope" for PATs).
          if grep -qiE 'refusing to allow .* to create or update workflow' /tmp/push.log; then
            cat >/tmp/push-comment.md <<'EOF'
          ⚠️ The operation succeeded locally, but the push was rejected by GitHub.

          Your fork is missing workflow files that were added to `main`. Rebasing pulls those
          commits into your branch, and the bot's token is not permitted to push files under
          `.github/workflows/` into your fork.

          **To unblock:** open your fork, switch to the `main` branch, click **Sync fork**,
          then comment `/rebase` again.
          EOF
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/push-comment.md
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "⚠️ The operation succeeded locally but the push failed. If this is a fork PR, please enable **Allow edits from maintainers** and retry."
          exit 1
