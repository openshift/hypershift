global
  maxconn 7000
  log stdout local0
  log stdout local1 notice

defaults
  mode tcp
  timeout client 10m
  timeout server 10m
  timeout connect 10s
  timeout client-fin 5s
  timeout server-fin 5s
  timeout queue 5s
  retries 3

resolvers nodedns
  parse-resolv-conf
  hold valid    10s
  hold nx       5m
  hold timeout  1h
  hold refused  1h
  hold other    1h
  resolve_retries 3
  timeout retry  1s
  timeout resolve 1s

frontend local_apiserver
  bind 172.20.0.1:6443
  log global
  mode tcp
  option tcplog
  default_backend remote_apiserver

backend remote_apiserver
  mode tcp
  log global
  option httpchk GET /version
  option log-health-checks
  default-server inter 10s fall 3 rise 3
  server controlplane kubeconfig-host:443 resolvers nodedns init-addr last,libc,none
