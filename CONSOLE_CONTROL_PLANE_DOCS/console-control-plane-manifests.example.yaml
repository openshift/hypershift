# =============================================================================
# ILLUSTRATIVE manifests: core OpenShift console running control-plane-side
# in a HyperShift HostedControlPlane (HCP) namespace on the MANAGEMENT cluster.
#
# NOT production-ready. Companion to CONSOLE_CONTROL_PLANE_STUDY.md.
#
# These objects would normally be GENERATED by the ported console-operator
# (running control-plane-side) + the HyperShift control-plane-operator (CPO),
# NOT hand-applied. Shown here to make the moving parts concrete.
#
# HOW THIS MAPS TO REAL IMPLEMENTATION (see the study for exact file:line):
#   - The CPO does NOT hand-write these YAMLs. It registers a v2 component
#     ("console-operator") whose asset dir is v2/assets/console-operator/. See
#     study §13 (CPO component: component.go/deployment.go, registration,
#     capability gate, konnectivity injection, image overrides).
#   - The konnectivity sidecar is NOT authored by hand: it is injected by
#     .InjectKonnectivityContainer(...) which auto-mounts the konnectivity
#     client cert/CA, sets KUBECONFIG, and runs the CPO image with
#     `run konnectivity-{https,socks5}-proxy` on :8090. The sidecar shown below
#     is a hand-rolled APPROXIMATION of what the injector produces — treat the
#     command/mounts as indicative, not literal. See study §13.3 and
#     support/controlplane-component/konnectivity-container.go.
#   - Guest KAS auth is NOT hand-rolled (see study §16): the OPERATOR uses
#     .InjectServiceAccountKubeConfig(...) (secret
#     console-operator-service-account-kubeconfig); the BRIDGE uses a
#     .InjectTokenMinterContainer{KubeAPIServerToken} sidecar that mints a bound
#     SA token file. The Opaque `console-guest-kubeconfig` secret below is a
#     REJECTED illustration only.
#   - Strategy = Option A (D1): port the console-operator upstream (split-cluster
#     refactor) to create the operand on MGMT while reconciling config CRs +
#     ConsolePlugin discovery on GUEST. Full-featured (plugins in scope). See
#     study §14 (dual clients, configurable operand namespace, off-cluster
#     bridge flag injection, resourceSyncer) and §17 (rejected direct-CPO
#     alternative).
#   - Console serving cert = the api-server cert-manager WILDCARD `*.<domain>`
#     (D3 (a)), NOT a service-ca/pki cert. See object 6 below.
#
# Placeholders (replace):
#   ${HCP_NAMESPACE}     e.g. clusters-myhc         (control-plane namespace)
#   ${CLUSTER_NAME}      e.g. myhc
#   ${BASE_DOMAIN}       e.g. hcp.example.com        (shared api/oauth/console domain;
#                        the cert-manager wildcard *.${BASE_DOMAIN} covers console)
#   ${OIDC_ISSUER_URL}   GCP HCP today: https://accounts.google.com (verified live; study Gap 4)
#   ${OIDC_CLIENT_ID}    console OIDC client id (GCP); provisioned + placed in the HC auth spec
#                        OIDCProviders[0].OIDCClients[] keyed openshift-console/console
#   ${CONSOLE_IMAGE}     console bridge image      (GetImage("console"), overridable D5)
#   ${CONSOLE_OP_IMAGE}  console-operator image    (GetImage("console-operator"), overridable D5)
#   ${KONN_PROXY_IMAGE}  konnectivity proxy image  (in reality: the CPO image itself)
#
# Guest KAS reachable in-namespace at: kube-apiserver.${HCP_NAMESPACE}.svc:6443
# Console hostname (D3, shared-router rails): console.${BASE_DOMAIN}
# =============================================================================

---
# -----------------------------------------------------------------------------
# 1. ServiceAccount for the console bridge pod (management-cluster identity).
#    This SA is for pod identity on the MGMT cluster only. Access to the GUEST
#    API is via a mounted GUEST service-account token (see secret below), NOT
#    this SA.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
    hypershift.openshift.io/control-plane-component: console

---
# -----------------------------------------------------------------------------
# 2. ServiceAccount for the ported console-operator (management-cluster identity).
#    In the real CPO component this is shipped as serviceaccount.yaml in
#    v2/assets/console-operator/ and auto-applied by the framework; the deployment
#    sets serviceAccountName: console-operator. See study §19.2 (CNO pattern).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-operator
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console-operator
    hypershift.openshift.io/control-plane-component: console-operator

---
# -----------------------------------------------------------------------------
# 3. MANAGEMENT-side RBAC (HCP namespace): console-operator manages the console
#    operand (Deployment/Service/ConfigMap/Secret/PDB/SA/Route) in the HCP
#    namespace. In the real component, ship role.yaml + rolebinding.yaml in
#    v2/assets/console-operator/ (clone cluster-network-operator's trio); the CPO
#    framework auto-applies them and rewrites the RoleBinding subject namespace.
#    See study §19.2.
#
#    GUEST-side RBAC is NOT defined here: the upstream console payload already
#    ships it (ClusterRoles/Roles/RoleBindings/SAs for `console-operator` and
#    `console`, incl. system:auth-delegator), annotated for hypershift + the
#    Console capability. CVO applies it AS-IS on the guest (we strip only the
#    guest console WORKLOAD, not its RBAC — see study §19.1 (RBAC) and §18 (removal).
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: console-operator
  namespace: ${HCP_NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: console-operator
  namespace: ${HCP_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: console-operator
subjects:
  - kind: ServiceAccount
    name: console-operator
    namespace: ${HCP_NAMESPACE}

---
# -----------------------------------------------------------------------------
# 4. GUEST kube-apiserver credentials — DO NOT hand-roll (see study §16).
#
#    The Opaque secret below is a REJECTED illustration kept only to show the
#    shape. The REAL mechanism is the standard HyperShift framework:
#      - OPERATOR: `.InjectServiceAccountKubeConfig(...)` generates secret
#        `console-operator-service-account-kubeconfig` (client-cert kubeconfig,
#        identity system:serviceaccount:<ns>:<name>, framework-rotated).
#      - BRIDGE: `.InjectTokenMinterContainer{KubeAPIServerToken}` sidecar mints
#        a bound SA bearer TOKEN FILE (audience = hcp.Spec.IssuerURL) consumed by
#        `-k8s-mode-off-cluster-service-account-bearer-token-file`; `-ca-file` =
#        guest KAS serving CA from the HCP namespace. Same pattern as CNO.
#    Neither is a hand-written Opaque secret. This block is indicative only.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: console-guest-kubeconfig
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
type: Opaque
stringData:
  # ILLUSTRATIVE ONLY — replaced by framework-injected kubeconfig + minted token
  # (study §16). Do not provision this by hand.
  token: "PROVIDED_BY_TOKEN_MINTER_SIDECAR"
  ca.crt: "GUEST_KAS_SERVING_CA_FROM_HCP_NAMESPACE"

---
# -----------------------------------------------------------------------------
# 5. OIDC client secret for the console bridge (external OIDC / GCP).
#    NOTE (study Gap 4): in real GCP HCP the client secret is referenced from the
#    HostedCluster auth spec (OIDCProviders[0].OIDCClients[].ClientSecret) and
#    HCCO copies it guest-side automatically (resources.go:1566+). This standalone
#    Secret is illustrative of what the bridge mounts (ClientSecretFile); the
#    delivery pipeline already exists and is not hand-created per-cluster.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: console-oidc-client
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
type: Opaque
stringData:
  clientSecret: "REPLACED_WITH_OIDC_CLIENT_SECRET"
  # Optional issuer CA if the OIDC issuer is not signed by a public CA.
  # ca.crt: "..."

---
# -----------------------------------------------------------------------------
# 6. Console serving cert (TLS terminates AT the console pod; router is
#    passthrough). Client is a BROWSER, so the leaf must be PUBLICLY TRUSTED.
#    Decision D3 (a): REUSE the api-server cert-manager WILDCARD cert
#    `*.${BASE_DOMAIN}` — provided as a Secret next to the HostedCluster and
#    referenced like spec.configuration.apiServer.servingCerts.namedCertificates.
#    The wildcard already covers console.${BASE_DOMAIN} (same base domain), so
#    NO dedicated console cert is needed. Fall back to a self-signed default only
#    for dev (browser will warn). NOT a service-ca cert (unavailable on GKE) and
#    NOT pki/console.go. Evolution (b): a dedicated console cert field.
#    The Secret below is the (shared) wildcard cert, shown for completeness.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: console-serving-cert   # in practice: the shared api wildcard secret, e.g. external-api-cert
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
type: kubernetes.io/tls
data:
  tls.crt: "" # cert-manager wildcard leaf, CN/SAN=*.${BASE_DOMAIN} (covers console.${BASE_DOMAIN})
  tls.key: "" # cert-manager wildcard key

---
# -----------------------------------------------------------------------------
# 7. Session secret for the bridge (rotated by console-operator).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: console-session
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
type: Opaque
stringData:
  sessionEncryptionKey: "REPLACED_32B"
  sessionAuthenticationKey: "REPLACED_64B"

---
# -----------------------------------------------------------------------------
# 8. Bridge config (console-config.yaml), generated by console-operator.
#    Illustrative subset: off-cluster KAS + OIDC. Plugins injected here from
#    guest ConsolePlugin CRs (endpoints are guest svc.cluster.local, reached via
#    the konnectivity socks5 sidecar + HTTP_PROXY).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-config
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
data:
  console-config.yaml: |
    apiVersion: console.openshift.io/v1
    kind: ConsoleConfig
    clusterInfo:
      consoleBaseAddress: https://console.${BASE_DOMAIN}
      masterPublicURL: https://api.${BASE_DOMAIN}:6443
    auth:
      authType: oidc
      oidcIssuer: ${OIDC_ISSUER_URL}
      clientID: ${OIDC_CLIENT_ID}
      oidcExtraScopes: []
    servingInfo:
      bindAddress: https://0.0.0.0:8443
      certFile: /var/serving-cert/tls.crt
      keyFile: /var/serving-cert/tls.key
    # plugins: injected from guest ConsolePlugin CRs; endpoints resolve in-guest
    # via the konnectivity socks5 proxy. Empty => core console only.
    plugins: {}

---
# -----------------------------------------------------------------------------
# 9. Console bridge Deployment (runs in the HCP namespace, control-plane-side).
#    Containers:
#      - console        : the bridge, off-cluster mode, OIDC
#      - konnectivity-proxy-socks5 : tunnels HTTP(S)_PROXY traffic (plugins /
#                          monitoring) into the GUEST network via the reverse
#                          konnectivity tunnel.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
    hypershift.openshift.io/control-plane-component: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
        hypershift.openshift.io/control-plane-component: console
    spec:
      serviceAccountName: console
      automountServiceAccountToken: true
      containers:
        # ---- bridge -----------------------------------------------------------
        - name: console
          image: ${CONSOLE_IMAGE}
          command:
            - /opt/bridge/bin/bridge
          args:
            - -listen=https://0.0.0.0:8443
            - -base-address=https://console.${BASE_DOMAIN}
            - -public-dir=/opt/bridge/static
            # ---- off-cluster: talk to the GUEST kube-apiserver in-namespace ----
            - -k8s-mode=off-cluster
            - -k8s-mode-off-cluster-endpoint=https://kube-apiserver.${HCP_NAMESPACE}.svc:6443
            - -k8s-mode-off-cluster-service-account-bearer-token-file=/var/run/secrets/guest/token
            - -ca-file=/var/run/secrets/guest/ca.crt
            # Public endpoint advertised to the browser/JS (guest API external).
            - -k8s-public-endpoint=https://api.${BASE_DOMAIN}:6443
            # ---- auth: external OIDC (GCP). Auth-agnostic; swap to openshift ----
            - -user-auth=oidc
            - -user-auth-oidc-issuer-url=${OIDC_ISSUER_URL}
            - -user-auth-oidc-client-id=${OIDC_CLIENT_ID}
            - -user-auth-oidc-client-secret-file=/var/oidc/clientSecret
            # ---- TLS at the pod (router is passthrough) ------------------------
            - -tls-cert-file=/var/serving-cert/tls.crt
            - -tls-key-file=/var/serving-cert/tls.key
          env:
            # Route plugin-asset / monitoring upstreams through the konnectivity
            # socks5 sidecar so they reach GUEST svc.cluster.local endpoints.
            # NOTE: bridge plugin-ASSET transport currently ignores proxy env;
            # requires the openshift/console fix at server.go:524
            # (add Proxy: http.ProxyFromEnvironment). See study §9.1.
            - name: HTTPS_PROXY
              value: socks5://127.0.0.1:8090
            - name: HTTP_PROXY
              value: socks5://127.0.0.1:8090
            - name: NO_PROXY
              value: kube-apiserver.${HCP_NAMESPACE}.svc,localhost,127.0.0.1,.svc.cluster.local.mgmt
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: guest-kubeconfig
              mountPath: /var/run/secrets/guest
              readOnly: true
            - name: oidc-client
              mountPath: /var/oidc
              readOnly: true
            - name: serving-cert
              mountPath: /var/serving-cert
              readOnly: true
            - name: config
              mountPath: /var/console-config
              readOnly: true
            - name: session
              mountPath: /var/session
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 100Mi

        # ---- konnectivity socks5 proxy sidecar -------------------------------
        # Tunnels arbitrary TCP into the guest network via the reverse
        # konnectivity tunnel (agents dial out from data plane). Mirrors the
        # pattern used by oauth-openshift / olm components. Listens :8090.
        #
        # DNS RESOLUTION (see study §5.1): the sidecar uses a CUSTOM resolver,
        # not the OS resolver. For a guest name like
        # thanos-querier.openshift-monitoring.svc it:
        #   1. skips cloud-provider APIs,
        #   2. PRIMARY: reads the Service's ClusterIP directly from the GUEST
        #      kube-apiserver (name split into <name>.<namespace>, GET service,
        #      return spec.clusterIP) — no DNS server call needed for plain
        #      ClusterIP Services (plugins + monitoring),
        #   3. optional: query GUEST CoreDNS (dns-default in openshift-dns) OVER
        #      the tunnel — enable with --resolve-from-guest-cluster-dns for
        #      non-Service names (headless/SRV/custom records),
        #   4. fallback to the default resolver.
        # It then DIALS the resolved guest ClusterIP THROUGH konnectivity so the
        # otherwise-unroutable guest IP becomes reachable from the mgmt side.
        #
        # REQUIREMENT: this sidecar needs a GUEST kubeconfig (KUBECONFIG below)
        # so step 2 (Service -> ClusterIP) works. Reuses the same guest creds as
        # the bridge.
        - name: konnectivity-proxy-socks5
          image: ${KONN_PROXY_IMAGE}
          command:
            - /usr/bin/control-plane-operator
            - konnectivity-socks5-proxy
          args:
            - run
            # Plain plugin/monitoring ClusterIP Services resolve via step 2
            # (Service->ClusterIP against the guest API) and do NOT need this flag.
            # Set --resolve-from-guest-cluster-dns=true ONLY if the bridge must
            # resolve non-Service names (headless/SRV/custom coreDNS records).
            # See study §13.10. Default: omitted (off).
          env:
            # GUEST kubeconfig: used both to resolve guest Services (step 2) and
            # to reach the guest API. NOT the management-cluster kubeconfig.
            - name: KUBECONFIG
              value: /var/run/secrets/guest/kubeconfig
          ports:
            - name: socks5
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: guest-kubeconfig
              mountPath: /var/run/secrets/guest
              readOnly: true
            - name: konnectivity-proxy-cert
              mountPath: /etc/konnectivity/proxy-client
              readOnly: true
            - name: konnectivity-proxy-ca
              mountPath: /etc/konnectivity/proxy-ca
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 30Mi

      volumes:
        - name: guest-kubeconfig
          secret:
            secretName: console-guest-kubeconfig
            defaultMode: 0640
        - name: oidc-client
          secret:
            secretName: console-oidc-client
            defaultMode: 0640
        - name: serving-cert
          secret:
            secretName: console-serving-cert
            defaultMode: 0640
        - name: config
          configMap:
            name: console-config
        - name: session
          secret:
            secretName: console-session
            defaultMode: 0640
        # konnectivity client cert/CA are provisioned by CPO for the HCP.
        - name: konnectivity-proxy-cert
          secret:
            secretName: konnectivity-client
            defaultMode: 0640
        - name: konnectivity-proxy-ca
          secret:
            secretName: konnectivity-ca
            defaultMode: 0640

---
# -----------------------------------------------------------------------------
# 10. Console bridge Service (ClusterIP). The HCP router's dynamic backend
#     discovery maps the Route (below, labeled HCPRouteLabel) to this Service.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
spec:
  selector:
    app: console
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
  type: ClusterIP

---
# -----------------------------------------------------------------------------
# 11. Console Route — TLS passthrough, labeled so the per-HCP HAProxy router
#     adopts it as an SNI backend (netutil.HCPRouteLabel). external-dns
#     registers spec.host (console.${BASE_DOMAIN}) in-zone.
#     Rides the shared public LB (public clusters) or GCP PSC (private).
# -----------------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: console
  namespace: ${HCP_NAMESPACE}
  labels:
    # NOTE: real label key is defined by netutil.HCPRouteLabel in HyperShift.
    hypershift.openshift.io/hosted-control-plane-route: "true"
    app: console
spec:
  host: console.${BASE_DOMAIN}
  to:
    kind: Service
    name: console
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect

---
# -----------------------------------------------------------------------------
# 12. PodDisruptionBudget for the bridge (HA; supports zero-node clusters since
#     the bridge runs control-plane-side, not on workers).
# -----------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: console

---
# -----------------------------------------------------------------------------
# 13. Ported console-operator Deployment (runs control-plane-side).
#     Uses a GUEST kubeconfig (--kubeconfig) to reconcile guest config CRs
#     (ConsolePlugin discovery, Route, OAuthClient, config.openshift.io reads),
#     while creating the console OPERAND (Deployment/Service/ConfigMap above)
#     in THIS management namespace. This split-target behavior is the upstream
#     dual-client refactor described in study §9.2.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-operator
  namespace: ${HCP_NAMESPACE}
  labels:
    app: console-operator
    hypershift.openshift.io/control-plane-component: console-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console-operator
  template:
    metadata:
      labels:
        app: console-operator
    spec:
      serviceAccountName: console-operator
      containers:
        - name: console-operator
          image: ${CONSOLE_OP_IMAGE}
          command:
            - console
          args:
            - operator
            # Guest kubeconfig: reconcile config CRs against the GUEST cluster.
            - --kubeconfig=/var/run/secrets/guest/kubeconfig
            # (Upstream refactor) operand target namespace on the MGMT cluster.
            - --operand-namespace=${HCP_NAMESPACE}
            # (Upstream refactor) guest KAS endpoint baked into generated bridge.
            - --guest-apiserver-endpoint=https://kube-apiserver.${HCP_NAMESPACE}.svc:6443
            # Image overrides for local dev (D5).
            - --console-image=${CONSOLE_IMAGE}
          env:
            # Operator reaches ONLY the guest KAS (a known endpoint) -> HTTPS
            # CONNECT proxy, not socks5. See study §13.10.
            - name: HTTPS_PROXY
              value: http://127.0.0.1:8090
            - name: NO_PROXY
              value: kube-apiserver.${HCP_NAMESPACE}.svc,localhost,127.0.0.1
          volumeMounts:
            - name: guest-kubeconfig
              mountPath: /var/run/secrets/guest
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 50Mi

        # Konnectivity HTTPS-proxy sidecar: the operator only needs to reach the
        # guest KAS (known endpoint) over the reverse tunnel, so HTTPS mode
        # (konnectivity-https-proxy) is used, NOT socks5. --resolve-from-guest-
        # cluster-dns is not caller-settable in HTTPS mode (the binary hard-codes
        # it). Precedent: oapi / ingress-operator. See study §13.10.
        # In reality this is injected by .InjectKonnectivityContainer({Mode: HTTPS}).
        - name: konnectivity-proxy-https
          image: ${KONN_PROXY_IMAGE}
          command:
            - /usr/bin/control-plane-operator
            - konnectivity-https-proxy
          args:
            - run
          env:
            - name: KUBECONFIG
              value: /var/run/secrets/guest/kubeconfig
          ports:
            - name: https
              containerPort: 8090
          volumeMounts:
            - name: guest-kubeconfig
              mountPath: /var/run/secrets/guest
              readOnly: true
            - name: konnectivity-proxy-cert
              mountPath: /etc/konnectivity/proxy-client
              readOnly: true
            - name: konnectivity-proxy-ca
              mountPath: /etc/konnectivity/proxy-ca
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 30Mi

      volumes:
        - name: guest-kubeconfig
          secret:
            secretName: console-guest-kubeconfig
            defaultMode: 0640
        - name: konnectivity-proxy-cert
          secret:
            secretName: konnectivity-client
            defaultMode: 0640
        - name: konnectivity-proxy-ca
          secret:
            secretName: konnectivity-ca
            defaultMode: 0640

# =============================================================================
# GUEST-CLUSTER-SIDE objects (NOT in this file / different cluster), for context:
#   - OAuthClient "console"        (only if D2 flips back to oauth auth)
#   - ConsolePlugin CRs            (day-2 plugins; reconciled by console-operator
#                                   above via the guest kubeconfig)
#   - config.openshift.io reads    (Infrastructure, Ingress, Proxy, Console, ...)
#   - Guest RBAC + SAs (console-operator, console, downloads) + guest namespaces
#     + system:auth-delegator bindings — applied AS-IS by CVO from the upstream
#     console payload (study §19.1). The bridge's guest token (§16 token-minter)
#     is for the GUEST openshift-console/console SA created by those manifests.
#   - clusteroperator/console + console.config .status.consoleURL — STILL written
#     into the guest by the control-plane operator (capability stays enabled)
# The guest console-operator payload is stripped from CVO ONLY when the placement
# flag is on (conditional preparePayloadScript, cvo/deployment.go:208-275), NOT
# unconditionally. The `Console` capability gate is kept unchanged (disabled =>
# no console anywhere). See study §18 and gaps Gap 7. Plugin backends keep
# running in the guest.
# =============================================================================
