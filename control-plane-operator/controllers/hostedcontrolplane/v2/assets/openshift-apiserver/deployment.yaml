apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-apiserver
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: openshift-apiserver
  strategy:
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: openshift-apiserver
    spec:
      containers:
      - args:
        - start
        - --config=/etc/kubernetes/config/config.yaml
        - --authorization-kubeconfig=/etc/kubernetes/secrets/svc-kubeconfig/kubeconfig
        - --authentication-kubeconfig=/etc/kubernetes/secrets/svc-kubeconfig/kubeconfig
        - --requestheader-client-ca-file=/etc/kubernetes/certs/aggregator-client-ca/ca.crt
        - --requestheader-allowed-names=kube-apiserver-proxy,system:kube-apiserver-proxy,system:openshift-aggregator
        - --requestheader-username-headers=X-Remote-User
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        - --client-ca-file=/etc/kubernetes/certs/client-ca/ca.crt
        env:
        - name: HTTP_PROXY
          value: http://127.0.0.1:8090
        - name: HTTPS_PROXY
          value: http://127.0.0.1:8090
        - name: NO_PROXY
          value: kube-apiserver,etcd-client,audit-webhook
        image: openshift-apiserver
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: livez?exclude=etcd
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: openshift-apiserver
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: readyz?exclude=etcd&exclude=etcd-readiness
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        startupProbe:
          httpGet:
            path: livez
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 30
        # Minimum request for scheduling. No limits set; container can burst.
        # CPO preserves live requests on reconcile — this only applies at creation.
        # See docs/content/how-to/cluster-sizing-guidance.md for tuning options.
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - mountPath: /etc/kubernetes/certs/aggregator-client-ca
          name: aggregator-ca
        - mountPath: /etc/kubernetes/audit-config
          name: audit-config
        - mountPath: /etc/kubernetes/certs/client-ca
          name: client-ca
        - mountPath: /etc/kubernetes/config
          name: config
        - mountPath: /etc/kubernetes/certs/etcd-client-ca
          name: etcd-client-ca
        - mountPath: /etc/kubernetes/certs/etcd-client
          name: etcd-client-cert
        - mountPath: /etc/kubernetes/secrets/svc-kubeconfig
          name: kubeconfig
        - mountPath: /etc/pki/ca-trust/extracted/pem
          name: oas-trust-anchor
        - mountPath: /var/lib/kubelet
          name: pull-secret
        - mountPath: /etc/kubernetes/certs/serving
          name: serving-cert
        - mountPath: /var/log/openshift-apiserver
          name: work-logs
        workingDir: /var/log/openshift-apiserver
      - args:
        - -c
        - |
          set -o errexit
          set -o nounset
          set -o pipefail

          function cleanup() {
            pkill -P $$$
            wait
            exit
          }
          trap cleanup SIGTERM

          /usr/bin/tail -c+1 -F /var/log/openshift-apiserver/audit.log &
          wait $!
        command:
        - /bin/bash
        image: cli
        imagePullPolicy: IfNotPresent
        name: audit-logs
        resources:
          requests:
            cpu: 5m
            memory: 10Mi
        volumeMounts:
        - mountPath: /var/log/openshift-apiserver
          name: work-logs
      initContainers:
      - command:
        - /bin/bash
        - -c
        - |2

          #!/bin/bash

          set -euo pipefail

          # Ensure the directory is empty, prevent restart from failing
          rm -rf /run/ca-trust-generated/* || {
            chmod -R u+w /run/ca-trust-generated/* 2>/dev/null || true
            rm -rf /run/ca-trust-generated/* || true
          }
          cp -f -r /etc/pki/ca-trust/extracted/pem/* /run/ca-trust-generated/

          if ! [[ -f /run/service-ca-signer/service-ca.crt ]]; then
             exit 0
          fi

          chmod 0666 /run/ca-trust-generated/tls-ca-bundle.pem
          echo '#service signer ca' >> /run/ca-trust-generated/tls-ca-bundle.pem
          cat /run/service-ca-signer/service-ca.crt >>/run/ca-trust-generated/tls-ca-bundle.pem
          chmod 0444 /run/ca-trust-generated/tls-ca-bundle.pem
        image: openshift-apiserver
        imagePullPolicy: IfNotPresent
        name: oas-trust-anchor-generator
        volumeMounts:
        - mountPath: /run/ca-trust-generated
          name: oas-trust-anchor
      - args:
        - -c
        - |
          #!/bin/bash
          set -eu
          # openshift-apiserver exits if it cannot reach etcd shortly after it
          # starts. Wait until the managed etcd client Service resolves and etcd
          # answers an authenticated health check. Both loops are bounded.
          etcd_host="etcd-client.$(POD_NAMESPACE).svc"
          max_attempts=100
          echo "Waiting for ${etcd_host} to resolve..."
          attempt=1
          # Each DNS query times out after one second and is not retried.
          until nslookup -timeout=1 -retry=1 "${etcd_host}"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "ERROR: ${etcd_host} did not resolve after ${attempt} attempts (${SECONDS}s elapsed); check the etcd-client service and cluster DNS." >&2
              exit 1
            fi
            echo "DNS lookup failed, retrying (attempt ${attempt}/${max_attempts})..."
            attempt=$((attempt + 1))
            sleep 1
          done
          echo "${etcd_host} resolved, checking etcd health..."
          attempt=1
          until curl --connect-timeout 1 --max-time 2 --fail --silent --show-error --output /dev/null \
            --cacert /etc/kubernetes/certs/etcd-client-ca/ca.crt \
            --cert /etc/kubernetes/certs/etcd-client/etcd-client.crt \
            --key /etc/kubernetes/certs/etcd-client/etcd-client.key \
            "https://${etcd_host}:2379/health"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "ERROR: etcd health check failed after ${attempt} attempts (${SECONDS}s elapsed); check the etcd pods and the etcd-client service." >&2
              exit 1
            fi
            if [ "${attempt}" -eq 10 ]; then
              echo "WARNING: etcd is still not healthy after ${attempt} attempts; check the etcd pods and the etcd-client service." >&2
            fi
            echo "etcd not ready, retrying (attempt ${attempt}/${max_attempts})..."
            attempt=$((attempt + 1))
            sleep 1
          done
          echo "etcd is ready and accepting connections (${SECONDS}s elapsed)"
        command:
        - /bin/bash
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: cli
        imagePullPolicy: IfNotPresent
        name: wait-for-etcd
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          # runAsGroup: 0 required to read etcd secrets (defaultMode: 416/0640 = group-readable only)
          runAsGroup: 0
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - mountPath: /etc/kubernetes/certs/etcd-client-ca
          name: etcd-client-ca
        - mountPath: /etc/kubernetes/certs/etcd-client
          name: etcd-client-cert
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir: {}
        name: work-logs
      - configMap:
          defaultMode: 420
          name: openshift-apiserver
        name: config
      - configMap:
          defaultMode: 420
          name: openshift-apiserver-audit
        name: audit-config
      - configMap:
          defaultMode: 420
          name: aggregator-client-ca
        name: aggregator-ca
      - configMap:
          defaultMode: 420
          name: etcd-ca
        name: etcd-client-ca
      - configMap:
          defaultMode: 420
          name: client-ca
        name: client-ca
      - name: kubeconfig
        secret:
          defaultMode: 416
          secretName: service-network-admin-kubeconfig
      - name: serving-cert
        secret:
          defaultMode: 416
          secretName: openshift-apiserver-cert
      - name: etcd-client-cert
        secret:
          defaultMode: 416
          secretName: etcd-client-tls
      - emptyDir: {}
        name: oas-trust-anchor
      - name: pull-secret
        secret:
          defaultMode: 416
          items:
          - key: .dockerconfigjson
            path: config.json
          secretName: combined-pull-secret
