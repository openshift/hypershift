apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-api
      name: cluster-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cluster-api
        name: cluster-api
    spec:
      containers:
      - args:
        - --namespace
        - $(MY_NAMESPACE)
        - --v=4
        - --leader-elect=true
        - --leader-elect-lease-duration=137s
        - --leader-elect-retry-period=26s
        - --leader-elect-renew-deadline=107s
        - --diagnostics-address=127.0.0.1:8080
        - --insecure-diagnostics
        env:
        - name: MY_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: cluster-capi-controllers
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 9440
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 60
          successThreshold: 1
          timeoutSeconds: 5
        name: manager
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 9440
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 40Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: capi-webhooks-tls
          readOnly: true
      - args:
        - --secure-listen-address=:8443
        - --upstream=http://127.0.0.1:8080/
        - --tls-cert-file=/etc/tls/private/tls.crt
        - --tls-private-key-file=/etc/tls/private/tls.key
        - --client-ca-file=/etc/tls/client/ca.crt
        - --config-file=/etc/kube-rbac-proxy/config.yaml
        - --allow-paths=/metrics
        image: kube-rbac-proxy
        imagePullPolicy: IfNotPresent
        name: kube-rbac-proxy
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: 1m
            memory: 15Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/tls/private
          name: metrics-tls
          readOnly: true
        - mountPath: /etc/tls/client
          name: metrics-client-ca
          readOnly: true
        - mountPath: /etc/kube-rbac-proxy
          name: kube-rbac-proxy-config
          readOnly: true
      serviceAccount: cluster-api
      serviceAccountName: cluster-api
      volumes:
      - name: capi-webhooks-tls
        secret:
          defaultMode: 416
          secretName: capi-webhooks-tls
      # The metrics volumes are optional so that a missing certificate only affects
      # metrics scraping and never blocks the CAPI manager container from starting.
      - name: metrics-tls
        secret:
          defaultMode: 416
          optional: true
          secretName: cluster-api-metrics-tls
      - name: metrics-client-ca
        secret:
          defaultMode: 416
          items:
          - key: ca.crt
            path: ca.crt
          optional: true
          secretName: metrics-client
      - configMap:
          defaultMode: 420
          name: cluster-api-kube-rbac-proxy
          optional: true
        name: kube-rbac-proxy-config
