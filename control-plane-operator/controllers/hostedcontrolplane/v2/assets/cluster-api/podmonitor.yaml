apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-api
spec:
  selector:
    matchLabels:
      app: cluster-api
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scheme: https
    tlsConfig:
      ca:
        configMap:
          key: ca.crt
          name: root-ca
      cert:
        secret:
          key: tls.crt
          name: metrics-client
      keySecret:
        key: tls.key
        name: metrics-client
      serverName: cluster-api
