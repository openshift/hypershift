apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-operators-catalog
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"catalogs:community-operators"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"extract-content\")].image"}, {"from":{"kind":"ImageStreamTag","name":"catalogs:community-operators"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"rebuild-cache\")].image"}, {"from":{"kind":"ImageStreamTag","name":"catalogs:community-operators"},"fieldPath":"spec.template.spec.containers[?(@.name==\"registry\")].image"}]'
spec:
  selector:
    matchLabels:
      olm.catalogSource: community-operators
  replicas: 1
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
      labels:
        olm.catalogSource: community-operators
        app: community-operators-catalog
        hypershift.openshift.io/control-plane-component: community-operators-catalog
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - args:
          - serve
          - /extracted-catalog/catalog
          - --cache-dir=/extracted-catalog/cache
          command:
          - /bin/opm
          name: registry
          image: catalogs:community-operators
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          terminationMessagePath: /dev/termination-log
          readinessProbe:
            exec:
              command:
                - grpc_health_probe
                - '-addr=:50051'
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - grpc_health_probe
                - '-addr=:50051'
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - grpc_health_probe
                - '-addr=:50051'
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 15
          resources:
            requests:
              cpu: 10m
              memory: 160Mi
          volumeMounts:
          - mountPath: /extracted-catalog
            name: catalog-content
      initContainers:
        - args:
          - /bin/copy-content
          - /utilities/copy-content
          command:
          - cp
          image: operator-lifecycle-manager
          name: extract-utilities
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /utilities
            name: utilities
        - args:
          - --catalog.from=/configs
          - --catalog.to=/extracted-catalog/catalog
          command:
          - /utilities/copy-content
          image: from:imagestream
          name: extract-content
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /utilities
            name: utilities
          - mountPath: /extracted-catalog
            name: catalog-content
        # rebuild-cache regenerates the opm cache from the extracted /configs instead of
        # copying the cache shipped in the catalog image. Filtered catalog images produced by
        # oc-mirror v2 ship a stale opm cache that no longer matches their filtered /configs
        # (OCPBUGS-109376), which makes `opm serve --cache-dir` fail its integrity check with
        # "cache requires rebuild". Rebuilding here keeps container startup fast while ensuring
        # the cache is always consistent with the served catalog.
        - args:
          - serve
          - /extracted-catalog/catalog
          - --cache-dir=/extracted-catalog/cache
          - --cache-only
          command:
          - /bin/opm
          image: from:imagestream
          name: rebuild-cache
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /extracted-catalog
            name: catalog-content
      volumes:
        - emptyDir: {}
          name: utilities
        - emptyDir: {}
          name: catalog-content
