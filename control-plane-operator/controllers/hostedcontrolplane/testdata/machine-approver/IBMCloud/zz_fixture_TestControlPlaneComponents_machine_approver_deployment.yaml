apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hypershift.openshift.io/desired-state-hash: e715d3f3aae0d3cc8a3d3734e6ebd0b6f2ae81d6c124d222dcfbadaec0e591c7
  labels:
    hypershift.openshift.io/managed-by: control-plane-operator
  name: machine-approver
  namespace: hcp-namespace
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: HostedControlPlane
    name: hcp
    uid: ""
  resourceVersion: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: machine-approver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: tmp-dir
        component.hypershift.openshift.io/config-hash: a53d18cd
        hypershift.openshift.io/release-image: quay.io/openshift-release-dev/ocp-release:4.16.10-x86_64
      labels:
        app: machine-approver
        hypershift.openshift.io/control-plane-component: machine-approver
        hypershift.openshift.io/hosted-control-plane: hcp-namespace
        hypershift.openshift.io/need-management-kas-access: "true"
      name: machine-approver
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/control-plane
                operator: In
                values:
                - "true"
            weight: 50
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/cluster
                operator: In
                values:
                - hcp-namespace
            weight: 100
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  hypershift.openshift.io/hosted-control-plane: hcp-namespace
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: true
      containers:
      - args:
        - "2"
        - /usr/bin/machine-approver
        - --help
        - "3"
        - --tls-min-version=VersionTLS12
        - --tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - --tls-curve-preferences=4588,29,23,24
        - /usr/bin/machine-approver
        - --config=/var/run/configmaps/config/config.yaml
        - -v=3
        - --logtostderr
        - --apigroup=cluster.x-k8s.io
        - --workload-cluster-kubeconfig=/etc/kubernetes/kubeconfig/kubeconfig
        - --disable-status-controller
        - --machine-namespace=hcp-namespace
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          help_count="$1"
          shift
          help_command=("${@:1:help_count}")
          shift "$help_count"
          tls_count="$1"
          shift
          tls_args=("${@:1:tls_count}")
          shift "$tls_count"

          help_exit=0
          help_output=$(timeout --signal=KILL 30s "${help_command[@]}" 2>&1) || help_exit=$?
          if [[ $help_exit -eq 137 ]]; then
            echo "TLS capability detection failed: help probe timed out or was killed for ${help_command[0]}" >&2
            exit 1
          fi
          declare -A supported_flags=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(-[[:alnum:]],?[[:space:]]+)?--?([[:alnum:]][[:alnum:]-]*)([[:space:]=]|$) ]]; then
              supported_flags["${BASH_REMATCH[2]}"]=1
            fi
          done <<< "$help_output"
          if [[ ${#supported_flags[@]} -eq 0 ]]; then
            echo "TLS capability detection failed: no flag declarations in help for ${help_command[0]}" >&2
            exit 1
          fi
          selected=()
          for arg in "${tls_args[@]}"; do
            flag="${arg%%=*}"
            flag="${flag#--}"
            if [[ -n "${supported_flags[$flag]:-}" ]]; then
              selected+=("$arg")
            else
              echo "Omitting unsupported TLS flag --$flag for ${help_command[0]}" >&2
            fi
          done
          exec "$@" "${selected[@]}"
        - tls-capability-check
        image: cluster-machine-approver
        imagePullPolicy: IfNotPresent
        name: machine-approver
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        securityContext:
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/kubernetes/kubeconfig
          name: kubeconfig
        - mountPath: /var/run/configmaps/config
          name: config
        - mountPath: /tmp
          name: tmp-dir
      initContainers:
      - command:
        - /usr/bin/control-plane-operator
        - availability-prober
        - --target
        - https://kube-apiserver:2040/readyz
        image: availability-prober
        imagePullPolicy: IfNotPresent
        name: availability-prober
        resources: {}
        terminationMessagePolicy: FallbackToLogsOnError
      priorityClassName: hypershift-control-plane
      restartPolicy: Always
      serviceAccount: machine-approver
      serviceAccountName: machine-approver
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: hypershift.openshift.io/control-plane
        operator: Equal
        value: "true"
      - effect: NoSchedule
        key: hypershift.openshift.io/cluster
        operator: Equal
        value: hcp-namespace
      volumes:
      - name: kubeconfig
        secret:
          defaultMode: 416
          secretName: service-network-admin-kubeconfig
      - configMap:
          defaultMode: 420
          name: machine-approver-config
          optional: true
        name: config
      - emptyDir: {}
        name: tmp-dir
status: {}
