apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    hypershift.openshift.io/desired-state-hash: 17ab4cdbeb01ebfd6c96af6ab2984e6af8e9e3b8e0bface8890776c0de14c4b7
  name: olm-operator
  namespace: hcp-namespace
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: HostedControlPlane
    name: hcp
    uid: ""
  resourceVersion: "1"
spec:
  endpoints:
  - metricRelabelings:
    - action: drop
      regex: etcd_(debugging|disk|server).*
      sourceLabels:
      - __name__
    - action: replace
      replacement: ""
      targetLabel: _id
    relabelings:
    - action: replace
      replacement: ""
      targetLabel: _id
    scheme: https
    targetPort: metrics
    tlsConfig:
      ca:
        configMap:
          key: ca.crt
          name: root-ca
      cert:
        secret:
          key: tls.crt
          name: metrics-client
      keySecret:
        key: tls.key
        name: metrics-client
      serverName: olm-operator-metrics
  namespaceSelector:
    matchNames:
    - hcp-namespace
  selector:
    matchLabels:
      app: olm-operator
