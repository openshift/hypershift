apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hypershift.openshift.io/desired-state-hash: 1056523e91d0070bc4d814ec13640e7b83ee4c3ef8dede3640b21c3c66ad6818
  labels:
    hypershift.openshift.io/managed-by: control-plane-operator
