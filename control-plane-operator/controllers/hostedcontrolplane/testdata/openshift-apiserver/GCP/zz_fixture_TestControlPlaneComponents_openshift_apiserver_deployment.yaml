          name: openshift-apiserver
        name: config
      - configMap:
          defaultMode: 420
          name: openshift-apiserver-audit
        name: audit-config
      - configMap:
          defaultMode: 420
          name: aggregator-client-ca
        name: aggregator-ca
      - configMap:
          defaultMode: 420
          name: etcd-ca
        name: etcd-client-ca
      - configMap:
          defaultMode: 420
          name: client-ca
        name: client-ca
      - name: kubeconfig
        secret:
          defaultMode: 416
          secretName: service-network-admin-kubeconfig
      - name: serving-cert
        secret:
          defaultMode: 416
          secretName: openshift-apiserver-cert
      - name: etcd-client-cert
        secret:
          defaultMode: 416
          secretName: etcd-client-tls
      - emptyDir: {}
        name: oas-trust-anchor
      - name: pull-secret
        secret:
          defaultMode: 416
          items:
          - key: .dockerconfigjson
            path: config.json
          secretName: combined-pull-secret
      - name: konnectivity-proxy-cert
        secret:
          defaultMode: 416
          secretName: konnectivity-client
      - configMap:
          name: konnectivity-ca-bundle
        name: konnectivity-proxy-ca
      - emptyDir: {}
