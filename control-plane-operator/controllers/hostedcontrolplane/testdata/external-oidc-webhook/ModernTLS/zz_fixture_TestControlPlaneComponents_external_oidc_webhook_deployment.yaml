apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hypershift.openshift.io/desired-state-hash: 3b9e519ce133f41a3e4067f981170ae8038c1ca93d269d3d336472cc755987c0
  labels:
    hypershift.openshift.io/managed-by: control-plane-operator
  name: external-oidc-webhook
  namespace: hcp-namespace
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: HostedControlPlane
    name: hcp
    uid: ""
  resourceVersion: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: external-oidc-webhook
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: tmp-dir
        component.hypershift.openshift.io/config-hash: 741638a5741638a5
        hypershift.openshift.io/release-image: quay.io/openshift-release-dev/ocp-release:4.16.10-x86_64
      labels:
        app: external-oidc-webhook
        hypershift.openshift.io/control-plane-component: external-oidc-webhook
        hypershift.openshift.io/hosted-control-plane: hcp-namespace
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/control-plane
                operator: In
                values:
                - "true"
            weight: 50
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/cluster
                operator: In
                values:
                - hcp-namespace
            weight: 100
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  hypershift.openshift.io/hosted-control-plane: hcp-namespace
              topologyKey: kubernetes.io/hostname
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: external-oidc-webhook
                hypershift.openshift.io/control-plane-component: external-oidc-webhook
                hypershift.openshift.io/hosted-control-plane: hcp-namespace
            topologyKey: topology.kubernetes.io/zone
          - labelSelector:
              matchLabels:
                app: external-oidc-webhook
                hypershift.openshift.io/control-plane-component: external-oidc-webhook
                hypershift.openshift.io/hosted-control-plane: hcp-namespace
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
      - args:
        - external-oidc
        - --config=/etc/kubernetes/config/auth-config/auth-config.json
        - --secure-port=8443
        - --tls-private-key-file=/etc/kubernetes/certs/serving/tls.key
        - --tls-cert-file=/etc/kubernetes/certs/serving/tls.crt
        - --v=2
        - --tls-min-version=VersionTLS13
        command:
        - /usr/bin/oauth-apiserver
        image: oauth-apiserver
        imagePullPolicy: IfNotPresent
        name: external-oidc-webhook
        resources:
          requests:
            cpu: 150m
            memory: 80Mi
        securityContext:
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/kubernetes/certs/serving
          name: serving-cert
        - mountPath: /etc/kubernetes/config/auth-config
          name: auth-config
        - mountPath: /etc/pki/ca-trust/extracted/pem
          name: openshift-config-managed-trusted-ca-bundle
          readOnly: true
        - mountPath: /tmp
          name: tmp-dir
      priorityClassName: hypershift-control-plane
      terminationGracePeriodSeconds: 120
      tolerations:
      - effect: NoSchedule
        key: hypershift.openshift.io/control-plane
        operator: Equal
        value: "true"
      - effect: NoSchedule
        key: hypershift.openshift.io/cluster
        operator: Equal
        value: hcp-namespace
      volumes:
      - name: serving-cert
        secret:
          defaultMode: 416
          secretName: external-oidc-webhook-cert
      - configMap:
          defaultMode: 420
          name: external-oidc-webhook-auth-config
        name: auth-config
      - configMap:
          defaultMode: 420
          items:
          - key: ca-bundle.crt
            path: tls-ca-bundle.pem
          name: openshift-config-managed-trusted-ca-bundle
          optional: true
        name: openshift-config-managed-trusted-ca-bundle
      - emptyDir: {}
        name: tmp-dir
status: {}
