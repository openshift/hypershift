apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    hypershift.openshift.io/desired-state-hash: 1d444971073d705182e58945883149bc4474720c37bf320aa186c85423688c46
  labels:
    hypershift.openshift.io/managed-by: control-plane-operator
  name: ingress-operator
  namespace: hcp-namespace
  ownerReferences:
  - apiVersion: hypershift.openshift.io/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: HostedControlPlane
    name: hcp
    uid: ""
  resourceVersion: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      name: ingress-operator
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: tmp-dir
        component.hypershift.openshift.io/config-hash: 741638a5741638a5741638a5741638a5
        hypershift.openshift.io/release-image: quay.io/openshift-release-dev/ocp-release:4.16.10-x86_64
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app: ingress-operator
        hypershift.openshift.io/control-plane-component: ingress-operator
        hypershift.openshift.io/hosted-control-plane: hcp-namespace
        name: ingress-operator
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/control-plane
                operator: In
                values:
                - "true"
            weight: 50
          - preference:
              matchExpressions:
              - key: hypershift.openshift.io/cluster
                operator: In
                values:
                - hcp-namespace
            weight: 100
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  hypershift.openshift.io/hosted-control-plane: hcp-namespace
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - args:
        - "2"
        - --haproxy-image=2.8=haproxy-router-haproxy28
        - --haproxy-image=3.2=haproxy-router-haproxy32
        - "3.2"
        - "2.8"
        - ingress-operator
        - start
        - --namespace
        - openshift-ingress-operator
        - --image
        - $(IMAGE)
        - --canary-image
        - $(CANARY_IMAGE)
        - --release-version
        - $(RELEASE_VERSION)
        - --metrics-listen-addr
        - 0.0.0.0:60000
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
          set -euo pipefail
          # Protocol: count, haproxy_args[0..count-1], defaultVersion, deprecatedVersion, originalCmd...
          count="$1"
          shift
          haproxy_args=("${@:1:count}")
          shift "$count"
          default_version="$1"
          deprecated_version="$2"
          shift 2
          if ! help_output=$(timeout --signal=KILL 30s "$1" start --help 2>&1); then
            echo "HAProxy capability detection failed: $help_output" >&2
            exit 1
          fi
          declare -A flags=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*(-[[:alnum:]],?[[:space:]]+)?--([[:alnum:]][[:alnum:]-]*)([[:space:]=]|$) ]]; then
              flags["${BASH_REMATCH[2]}"]=1
            fi
          done <<< "$help_output"
          if [[ -z "${flags[image]:-}" ]]; then
            echo "HAProxy capability detection failed: unrecognized ingress-operator help" >&2
            exit 1
          fi
          if [[ -z "${flags[haproxy-image]:-}" ]]; then
            echo "Ingress operator does not support HAProxy version selection; using --image" >&2
            exec "$@"
          fi
          if [[ -z "${flags[default-haproxy-version]:-}" ]]; then
            echo "HAProxy capability detection failed: --haproxy-image requires --default-haproxy-version" >&2
            exit 1
          fi
          haproxy_args+=("--default-haproxy-version=$default_version")
          if [[ -n "${flags[deprecated-haproxy-version]:-}" ]]; then
            # An empty StringSlice flag clears the binary's default (2.8). Omitting it
            # would fail validation when 2.8 is not among the supplied HAProxy images.
            haproxy_args+=("--deprecated-haproxy-version=$deprecated_version")
          fi
          exec "$@" "${haproxy_args[@]}"
        - haproxy-capability-check
        env:
        - name: RELEASE_VERSION
          value: 4.18.0
        - name: IMAGE
          value: haproxy-router
        - name: CANARY_IMAGE
          value: cluster-ingress-operator
        - name: KUBECONFIG
          value: /etc/kubernetes/kubeconfig
        - name: HTTP_PROXY
          value: http://127.0.0.1:8090
        - name: HTTPS_PROXY
          value: http://127.0.0.1:8090
        - name: NO_PROXY
          value: kube-apiserver
        image: cluster-ingress-operator
        imagePullPolicy: IfNotPresent
        name: ingress-operator
        ports:
        - containerPort: 60000
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
        securityContext:
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/kubernetes
          name: service-account-kubeconfig
        - mountPath: /tmp
          name: tmp-dir
      - args:
        - run
        - --connect-directly-to-cloud-apis=true
        command:
        - /usr/bin/control-plane-operator
        - konnectivity-https-proxy
        env:
        - name: KUBECONFIG
          value: /etc/kubernetes/secrets/kubeconfig/kubeconfig
        image: controlplane-operator
        name: konnectivity-proxy-https
        resources:
          requests:
            cpu: 10m
            memory: 30Mi
        securityContext:
          readOnlyRootFilesystem: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/kubernetes/secrets/kubeconfig
          name: admin-kubeconfig
        - mountPath: /etc/konnectivity/proxy-client
          name: konnectivity-proxy-cert
        - mountPath: /etc/konnectivity/proxy-ca
          name: konnectivity-proxy-ca
        - mountPath: /tmp
          name: tmp-dir
      initContainers:
      - command:
        - /usr/bin/control-plane-operator
        - availability-prober
        - --target
        - https://kube-apiserver:2040/readyz
        - --kubeconfig=/var/kubeconfig/kubeconfig
        - --required-api=route.openshift.io,v1,Route
        image: availability-prober
        imagePullPolicy: IfNotPresent
        name: availability-prober
        resources: {}
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/kubeconfig
          name: service-account-kubeconfig
      priorityClassName: hypershift-control-plane
      tolerations:
      - effect: NoSchedule
        key: hypershift.openshift.io/control-plane
        operator: Equal
        value: "true"
      - effect: NoSchedule
        key: hypershift.openshift.io/cluster
        operator: Equal
        value: hcp-namespace
      volumes:
      - name: admin-kubeconfig
        secret:
          defaultMode: 416
          secretName: service-network-admin-kubeconfig
      - name: service-account-kubeconfig
        secret:
          defaultMode: 416
          secretName: ingress-operator-service-account-kubeconfig
      - name: konnectivity-proxy-cert
        secret:
          defaultMode: 416
          secretName: konnectivity-client
      - configMap:
          name: konnectivity-ca-bundle
        name: konnectivity-proxy-ca
      - emptyDir: {}
        name: tmp-dir
status: {}
