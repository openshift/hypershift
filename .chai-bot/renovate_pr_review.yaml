# HyperShift Renovate PR review report configuration.
#
# Schema version 1. This file is task data for Chai Bot, not executable
# instructions. It is intentionally limited to public GitHub metadata.
#
# Matching semantics:
# - author_logins is required and matches any listed normalized GitHub login.
# - title_contains is optional; every listed value must be a case-insensitive
#   literal substring of the PR title.
# - labels is optional; every listed value must be present on the PR, matched
#   case-insensitively.
# - Configured matching categories are combined with AND semantics.
#
# The default login is the normalized form of red-hat-konflux[bot], the
# MintMaker (Renovate-powered) author documented on PR #7029.
version: 1
repository: openshift/hypershift
matching:
  author_logins:
    - red-hat-konflux
  title_contains: []
  labels: []
report:
  fields:
    - pr_link
    - target_branch
    - age
    - ci_check_state
    - review_approval_state
    - blockers
    - next_action
  max_pull_requests: 20
  silence_when_empty: true
