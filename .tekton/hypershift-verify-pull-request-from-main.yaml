apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/hypershift?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "main"
      && ("Dockerfile.verify".pathChanged()
         || ".tekton/hypershift-verify-pull-request-from-main.yaml".pathChanged())
      && !".tekton/pipelines/common-operator-build.yaml".pathChanged()
      && !".tekton/hypershift-verify-pull-request.yaml".pathChanged()
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: hypershift-verification
    appstudio.openshift.io/component: hypershift-verify
    pipelines.appstudio.openshift.io/type: build
  name: hypershift-verify-on-pr-from-main
  namespace: crt-redhat-acm-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/crt-redhat-acm-tenant/hypershift-verify:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: build-platforms
    value:
    - linux/amd64
    - linux/arm64
  - name: hermetic
    value: "false"
  - name: dockerfile
    value: Dockerfile.verify
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: "https://github.com/openshift/hypershift.git"
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/pipelines/common-operator-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-hypershift-verify
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
