      steps:
        - name: aws-guest-olm-configured-workers
          variant: guest-olm
          labelFilter: hosted-cluster-health-configured-workers
        - name: aws-guest-olm-common-before
          variant: guest-olm
          labelFilter: (hosted-cluster-health || control-plane-workloads || hosted-cluster-compliance || hosted-cluster-security || hosted-cluster-node-communication || hosted-cluster-metrics || aws-control-plane-customization) && !hosted-cluster-health-configured-workers && !hosted-cluster-ingress
