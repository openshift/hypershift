          variant: guest-olm
          labelFilter: hosted-cluster-health || control-plane-workloads || hosted-cluster-compliance || hosted-cluster-security
        - name: aws-guest-olm-common-after
          variant: guest-olm
          labelFilter: (hosted-cluster-health || control-plane-workloads || hosted-cluster-compliance || hosted-cluster-security || hosted-cluster-ingress || hosted-cluster-node-communication || hosted-cluster-metrics || aws-control-plane-customization) && !hosted-cluster-health-configured-workers
    - name: aws-dedicated-trust-bundle
